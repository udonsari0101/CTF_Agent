name: Check official CLI versions

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: ctf-agent-cli-version-monitor
  cancel-in-progress: false

jobs:
  propose:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Read official npm release channels and align image/runtime pins
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/update_cli_versions.py --apply | tee "$RUNNER_TEMP/cli-versions.json"
          if git diff --quiet -- Dockerfile.toolchain ctf_agent/solver_worker.py ctf_agent/providers/claude_runtime.py; then
            echo 'CLI_UPDATE_NEEDED=false' >> "$GITHUB_ENV"
          else
            # A pending PR with identical pins already passed the candidate
            # smoke test. Do not rebuild its multi-gigabyte base every day.
            git fetch origin 'refs/heads/automation/cli-pins:refs/remotes/origin/automation/cli-pins' 2>/dev/null || true
            pending="$(gh pr list --head automation/cli-pins --base main --state open --json number --jq '.[0].number')"
            if [[ "$pending" =~ ^[0-9]+$ ]] &&
               git diff --quiet origin/automation/cli-pins -- Dockerfile.toolchain ctf_agent/solver_worker.py ctf_agent/providers/claude_runtime.py; then
              echo 'CLI_UPDATE_NEEDED=false' >> "$GITHUB_ENV"
            else
              echo 'CLI_UPDATE_NEEDED=true' >> "$GITHUB_ENV"
            fi
          fi
      - name: Build and smoke-test candidate image before proposing it
        if: env.CLI_UPDATE_NEEDED == 'true'
        shell: bash
        run: |
          set -euo pipefail
          docker build --file Dockerfile.toolchain --tag ctf-agent-cli-candidate:toolchain .
          docker build --file Dockerfile \
            --build-arg TOOLCHAIN_IMAGE=ctf-agent-cli-candidate:toolchain \
            --build-arg RELEASE_SHA="$GITHUB_SHA" \
            --tag ctf-agent-cli-candidate:app .
          docker run --rm -i --network none \
            --tmpfs /data:uid=10001,gid=10001,mode=0700 \
            --tmpfs /solver-scratch:uid=10001,gid=10001,mode=0700 \
            --entrypoint python ctf-agent-cli-candidate:app - < deploy/image-smoke.py
      - name: Open or update a reviewable toolchain PR
        if: env.CLI_UPDATE_NEEDED == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin 'refs/heads/automation/cli-pins:refs/remotes/origin/automation/cli-pins' || true
          git switch -c automation/cli-pins
          git add Dockerfile.toolchain ctf_agent/solver_worker.py ctf_agent/providers/claude_runtime.py
          git commit -m 'Update pinned Codex and Claude Code runtimes'
          git push --force-with-lease origin HEAD:refs/heads/automation/cli-pins
          if ! gh pr list --head automation/cli-pins --base main --state open --json number --jq '.[0].number' | grep -Eq '^[0-9]+$'; then
            cat > "$RUNNER_TEMP/cli-pr.md" <<'EOF'
          Update the pinned Codex `latest` and Claude Code `stable` npm releases together with their runtime version checks.

          The candidate toolchain and application image passed `deploy/image-smoke.py` before this PR was opened. The normal image workflow will build the immutable commit-SHA image and move `production` only after its own smoke test passes.
          EOF
            gh pr create --base main --head automation/cli-pins \
              --title 'Update pinned Codex and Claude Code runtimes' \
              --body-file "$RUNNER_TEMP/cli-pr.md"
          fi
          # GITHUB_TOKEN-created pull requests do not automatically trigger
          # pull_request workflows. workflow_dispatch is the supported exception.
          gh workflow run ci.yml --ref automation/cli-pins
