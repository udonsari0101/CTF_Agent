name: Local installer release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag (for example v0.1.0)
        required: true

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Build and verify local installer archive
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          revision="$(git rev-list -n 1 "$RELEASE_TAG")"
          if [ "$GITHUB_EVENT_NAME" = push ]; then test "$revision" = "$GITHUB_SHA"; fi
          git merge-base --is-ancestor "$revision" origin/main
          git checkout --detach "$revision"
          python3 scripts/package_local_release.py --version "$RELEASE_TAG" --commit "$revision"
          (cd dist && sha256sum --check "CTF_Agent-${RELEASE_TAG}-local-windows.zip.sha256")
          python3 -m unittest discover -s tests -p 'test_local_release.py'
          unzip -p "dist/CTF_Agent-${RELEASE_TAG}-local-windows.zip" "CTF_Agent-${RELEASE_TAG}/installer/install.sh" | bash -n
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" \
            "dist/CTF_Agent-${RELEASE_TAG}-local-windows.zip" \
            "dist/CTF_Agent-${RELEASE_TAG}-local-windows.zip.sha256" \
            --title "CTF Agent $RELEASE_TAG" \
            --notes "Windows Docker Desktop + WSL 2 installer. Extract the ZIP and run Install.cmd, then create the first administrator in the browser. Choose a WSL data directory during setup; upgrades preserve it. The web interface supports English and Korean."
