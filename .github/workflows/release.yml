name: Local installer release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag (for example v0.1.0)
        required: true

permissions:
  actions: read
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Build and verify local installer archive
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          revision="$(git rev-list -n 1 "$RELEASE_TAG")"
          if [ "$GITHUB_EVENT_NAME" = push ]; then test "$revision" = "$GITHUB_SHA"; fi
          tagger="$(git for-each-ref --format='%(taggeremail)' "refs/tags/$RELEASE_TAG")"
          if [ "$tagger" = '<codex@users.noreply.github.com>' ]; then
            echo 'Release tag attribution is not configured for the repository owner.' >&2
            exit 1
          fi
          git merge-base --is-ancestor "$revision" origin/main
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/ctf-agent-public"
          python3 -m scripts.wait_release_image \
            --revision "$revision" --image "$image" \
            --repository "$GITHUB_REPOSITORY" --timeout-seconds 10200
          git checkout --detach "$revision"
          test "$(git rev-parse HEAD)" = "$revision"
          python3 scripts/package_local_release.py --version "$RELEASE_TAG" --commit "$revision"
          (cd dist && sha256sum --check "CTF_Agent-${RELEASE_TAG}-local-windows.zip.sha256")
          digest="$(python3 scripts/check_release_identity.py \
            --tag "$RELEASE_TAG" --revision "$revision" \
            --archive "dist/CTF_Agent-${RELEASE_TAG}-local-windows.zip" --image "$image")"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          python3 - <<'PY'
          import os
          from pathlib import Path
          from zipfile import ZipFile

          tag = os.environ['RELEASE_TAG']
          archive = Path('dist') / f'CTF_Agent-{tag}-local-windows.zip'
          prefix = f'CTF_Agent-{tag}/'
          with ZipFile(archive) as bundle:
              names = set(bundle.namelist())
              required = {'Install.cmd', 'Install.ps1', 'DatabaseDisk.ps1', 'DockerDesktop.ps1', 'DockerDisk.ps1',
                          'Start.cmd', 'Start.ps1', 'Uninstall.cmd', 'Uninstall.ps1',
                          'installer/install.sh', 'installer/start.sh',
                          'installer/uninstall.py', 'installer/storage_control.py',
                          'installer/storage_preflight.py',
                          'app/Dockerfile.updater', 'app/Dockerfile.local-runtime',
                          'app/deploy/local_runtime.py', 'app/deploy/local-seccomp.json',
                          'app/deploy/local-seccomp.README.md', 'app/deploy/moby-profiles-LICENSE',
                          'app/ctf_agent/release_updates.py',
                          'app/deploy/production-update.py', 'app/deploy/bootstrap-production-update.sh',
                          'app/deploy/PRODUCTION_UPDATE.md',
                          'app/.github/scripts/remote-rollout.sh',
                          'app/ctf_agent/main.py', 'app/ctf_agent/staged_files.py',
                          'app/ctf_agent/transfer_export_budget.py',
                          'app/ctf_agent/web/i18n/en.json',
                          'app/ctf_agent/web/i18n/ko.json'}
              assert all(prefix + name in names for name in required)
              assert not any('/tests/' in name or name.endswith('/requirements-dev.txt') for name in names)
              assert bundle.testzip() is None
          PY
          unzip -p "dist/CTF_Agent-${RELEASE_TAG}-local-windows.zip" "CTF_Agent-${RELEASE_TAG}/installer/install.sh" | bash -n
          unzip -p "dist/CTF_Agent-${RELEASE_TAG}-local-windows.zip" "CTF_Agent-${RELEASE_TAG}/installer/start.sh" | bash -n
          unzip -p "dist/CTF_Agent-${RELEASE_TAG}-local-windows.zip" "CTF_Agent-${RELEASE_TAG}/installer/storage_control.py" | python3 -c 'import sys; compile(sys.stdin.read(), "storage_control.py", "exec")'
          unzip -p "dist/CTF_Agent-${RELEASE_TAG}-local-windows.zip" "CTF_Agent-${RELEASE_TAG}/app/deploy/local-seccomp.json" | python3 -c 'import json,sys; assert isinstance(json.load(sys.stdin)["syscalls"], list)'
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          revision="$(git rev-list -n 1 "$RELEASE_TAG")"
          previous="$(git describe --tags --match 'v[0-9]*' --abbrev=0 "$revision^" 2>/dev/null || true)"
          notes="$RUNNER_TEMP/release-notes.md"
          {
            printf '## Changes\n\n'
            if [ -n "$previous" ]; then
              git log --no-merges --reverse --max-count=50 --format='- %s' "$previous..$revision"
              printf '\n[Full changelog](https://github.com/%s/compare/%s...%s)\n' "$GITHUB_REPOSITORY" "$previous" "$RELEASE_TAG"
            else
              git log --no-merges --reverse --max-count=50 --format='- %s' "$revision"
            fi
          } > "$notes"
          python3 scripts/check_release_notes.py "$notes" \
            --repository "$GITHUB_REPOSITORY" --tag "$RELEASE_TAG"
          cp "$notes" dist/release-notes.md
          gh release create "$RELEASE_TAG" \
            "dist/CTF_Agent-${RELEASE_TAG}-local-windows.zip" \
            "dist/CTF_Agent-${RELEASE_TAG}-local-windows.zip.sha256" \
            "dist/release-notes.md" \
            --title "CTF Agent $RELEASE_TAG" \
            --notes-file "$notes"
