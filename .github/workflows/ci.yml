name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Test application
        run: python -m pytest -q
      - name: Check scripts and local stack
        run: |
          python -m compileall -q ctf_agent deploy/local-compose.py scripts/package_local_release.py
          for script in ctf_agent/web/*.js ctf_agent/web/i18n/*.js; do node --check "$script"; done
          bash -n installer/installer/install.sh
          sh -n deploy/submit-flag deploy/request-remote deploy/connect-remote deploy/ctf-browser
          docker compose -f compose.local.yaml config --quiet
