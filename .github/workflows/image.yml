name: Publish container image

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  packages: write

concurrency:
  group: ctf-agent-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      BUILD_SHA: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ env.BUILD_SHA }}
      - name: Confirm successful CI for manual build
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$BUILD_SHA" =~ ^[0-9a-f]{40}$ ]]
          passed="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$BUILD_SHA&status=success&per_page=20" --jq '.workflow_runs | length')"
          test "$passed" -gt 0
      - name: Build, smoke test, and publish immutable images
        env:
          GHCR_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin >/dev/null
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          app="ghcr.io/$owner/ctf-agent-public"
          toolchain="ghcr.io/$owner/ctf-agent-public-toolchain"
          fingerprint="$(sha256sum Dockerfile.toolchain toolchain.lock requirements.txt requirements-ctf.txt deploy/DecompileAll.java deploy/DecompileFn.java | sha256sum | cut -d' ' -f1)"
          toolchain_version="$(sed -n 's/^toolchain_version=//p' toolchain.lock)"
          [[ "$toolchain_version" =~ ^[1-9][0-9]*$ ]]
          toolchain_tag="$toolchain:toolchain-$toolchain_version-$fingerprint"
          app_tag="$app:$BUILD_SHA"

          retry_once() {
            if "$@"; then return 0; fi
            echo 'Build failed; retrying once after 20 seconds.' >&2
            sleep 20
            "$@"
          }

          if ! docker manifest inspect "$toolchain_tag" >/dev/null 2>&1; then
            retry_once docker build --file Dockerfile.toolchain --tag "$toolchain_tag" .
            docker push "$toolchain_tag"
          fi
          docker pull "$toolchain_tag" >/dev/null
          toolchain_ref="$(docker image inspect --format '{{index .RepoDigests 0}}' "$toolchain_tag")"
          case "$toolchain_ref" in "$toolchain"@sha256:*) ;; *) echo 'Toolchain digest unavailable' >&2; exit 1 ;; esac

          release_version="$(python3 -c 'import tomllib; print("v" + tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          [[ "$release_version" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]

          if docker manifest inspect "$app_tag" >/dev/null 2>&1; then
            docker pull "$app_tag" >/dev/null
          else
            retry_once docker build --file Dockerfile --build-arg "TOOLCHAIN_IMAGE=$toolchain_ref" --build-arg "RELEASE_SHA=$BUILD_SHA" --build-arg "RELEASE_VERSION=$release_version" --tag "$app_tag" .
          fi
          revision="$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$app_tag")"
          test "$revision" = "$BUILD_SHA"
          image_version="$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.version"}}' "$app_tag")"
          test "$image_version" = "$release_version"
          image_bytes="$(docker image inspect --format '{{.Size}}' "$app_tag")"
          [[ "$image_bytes" =~ ^[1-9][0-9]*$ ]]
          # Keep stdin attached so Python executes the smoke script. Provide
          # the same writable home/scratch paths the solver has in Compose.
          docker run --rm -i --network none \
            --tmpfs /data:uid=10001,gid=10001,mode=0700 \
            --tmpfs /solver-scratch:uid=10001,gid=10001,mode=0700 \
            --entrypoint python "$app_tag" - < deploy/image-smoke.py
          if ! docker manifest inspect "$app_tag" >/dev/null 2>&1; then
            docker push "$app_tag"
          fi
          current_main="$(git ls-remote origin refs/heads/main | cut -f1)"
          [[ "$current_main" =~ ^[0-9a-f]{40}$ ]]
          if [ "$BUILD_SHA" = "$current_main" ]; then
            docker tag "$app_tag" "$app:production"
            docker push "$app:production"
          else
            echo 'A newer main commit exists; keeping the current production tag.' >> "$GITHUB_STEP_SUMMARY"
          fi
          digest="$(docker image inspect --format '{{index .RepoDigests 0}}' "$app_tag")"
          printf 'Published %s\nToolchain %s\nUnpacked image bytes %s\n' "$digest" "$toolchain_ref" "$image_bytes" >> "$GITHUB_STEP_SUMMARY"
