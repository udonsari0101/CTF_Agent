[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ctf-agent-workspace"
version = "0.4.22"
description = "CTF workspace, solver, attachment and notes management"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "python-multipart>=0.0.20,<1", "httpx>=0.28,<1", "cryptography>=50,<51", "py7zr>=1,<2"]

[project.scripts]
submit-flag = "ctf_agent.submit_flag:main"

[tool.setuptools.packages.find]
include = ["ctf_agent*"]

[tool.setuptools.package-data]
ctf_agent = ["web/*", "web/i18n/*", "agent_assets/prompts/*.md", "agent_assets/scaffolds/*.md"]
